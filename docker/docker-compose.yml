version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: saas_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-data_engineer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password123}
      POSTGRES_DB: ${POSTGRES_DB:-saas_analytics}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
